# A workflow that runs tests on every new pull request
name: Test

on:
  repository_dispatch:
    types: [test]
  pull_request:
    branches: ['*']
  push:
    branches: ['*']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up build JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '11'

    - name: Run tests
      run: ./gradlew check test jacocoTestReport --stacktrace

    - name: Send test results to CodeCov
      run: bash <(curl -s https://codecov.io/bash)

  java8-compatibility:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up build JDK
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '11'

    - name: Install Java 8 runtime
      id: java8
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '8'
        set-default: false

    - name: Run Java 8 compatibility check
      env:
        JAVA8_HOME: ${{ steps.java8.outputs.path }}
      run: ./gradlew java8Test -Porg.gradle.java.installations.paths="$JAVA8_HOME" --stacktrace
